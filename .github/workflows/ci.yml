# Awde CI: lint + test + build on every push/PR, plus a DB-backed job that
# exercises the content cache against a REAL Postgres.
#
# The main suite runs WITHOUT a DATABASE_URL on purpose (135 tests cover the
# local/offline invariant, and the app must keep working with no DB
# configured). Secrets (OPENROUTER_API_KEY, DATABASE_URL) are never needed here;
# they belong to the host's secrets manager at deploy time. The DB job starts a
# throwaway postgres service container (no secrets) purely to exercise
# migrations + the generated_units cache read/write path.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    name: Lint, Test, Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify production bundle boots & serves health (no DB)
        run: |
          set -e
          NODE_ENV=production PORT=4173 node dist/server.cjs &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null 2>&1; then
              echo "health OK"
              kill $PID
              exit 0
            fi
            sleep 0.5
          done
          echo "server failed to boot" >&2
          kill $PID || true
          exit 1

  db-cache:
    name: Content-cache against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awde
          POSTGRES_PASSWORD: awde
          POSTGRES_DB: awdetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awde"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run DB-gated cache tests
        env:
          DATABASE_URL: postgres://awde:awde@localhost:5432/awdetest
        run: npx vitest run tests/cache-db.test.ts