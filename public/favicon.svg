<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Awde "Mastery Core" — circle + hexagon, emerald/teal.
       A hexagonal knowledge node perfectly centered, encircled by two mastery
       rings, with three orbit nodes set symmetrically on the outer ring. Clean,
       bold strokes, readable at favicon and hero sizes. -->
  <defs>
    <linearGradient id="awde-core-a" x1="16" y1="10.2" x2="16" y2="21.8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Outer mastery ring -->
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#059669" stroke-width="1.7"/>
  <!-- Inner mastery ring -->
  <circle cx="16" cy="16" r="8.6" fill="none" stroke="#14b8a6" stroke-width="1.7"/>

  <!-- Orbit nodes, symmetric at 90/210/330 deg on outer ring -->
  <circle cx="16" cy="3.4" r="1.5" fill="#14b8a6"/>
  <circle cx="5.1" cy="9.7" r="1.3" fill="#059669"/>
  <circle cx="26.9" cy="9.7" r="1.3" fill="#34d399"/>

  <!-- Central core: solid hexagonal knowledge node, centered (16,16) -->
  <path d="M16 10.4 L20.85 13.2 L20.85 18.8 L16 21.6 L11.15 18.8 L11.15 13.2 Z" fill="url(#awde-core-a)"/>
</svg>
