<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Awde Logo Concept B — "The Network" (Node-Graph style).
       A clean knowledge web: three ideas stream down and converge into one
       understanding. Bold nodes + thick connectors — a connected graph, distinct
       from the radial rings. Palette: emerald/teal. -->
  <defs>
    <linearGradient id="awde-net-b" x1="16" y1="4" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#14b8a6"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Connectors: three ideas converging into the base node -->
  <g stroke="url(#awde-net-b)" stroke-width="2.2" stroke-linecap="round">
    <path d="M8 7 L16 21"/>
    <path d="M16 7 L16 21"/>
    <path d="M24 7 L16 21"/>
  </g>
  <!-- horizontal link among the three top ideas -->
  <path d="M8 7 L24 7" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Three idea nodes across the top -->
  <circle cx="8" cy="7" r="2.6" fill="#14b8a6"/>
  <circle cx="16" cy="7" r="2.6" fill="#34d399"/>
  <circle cx="24" cy="7" r="2.6" fill="#14b8a6"/>

  <!-- Converged understanding node (base) -->
  <circle cx="16" cy="21" r="3.6" fill="url(#awde-net-b)"/>
</svg>
